components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
          allOf:
          - $ref: '#/components/schemas/Job'
          readOnly: true
        job_id:
          type: integer
          writeOnly: true
        candidate:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        status_history:
          type: array
