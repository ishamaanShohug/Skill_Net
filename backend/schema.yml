  /api/jobs/:
    get:
      operationId: jobs_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - CONTRACT
          - FREELANCE
          - FULL_TIME
          - INTERNSHIP
          - PART_TIME
        description: |-
          * `FULL_TIME` - Full-time
          * `PART_TIME` - Part-time
          * `CONTRACT` - Contract
          * `INTERNSHIP` - Internship
          * `FREELANCE` - Freelance
      - in: query
        name: location
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
